name: Build VlcRemote Android

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag versione della release (es. v2.7.5). Vuoto per fallire: un default avrebbe creato una release fasulla.'
        required: true
        default: ''

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.47.5"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  create-release:
    name: Create GitHub Release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release.apk

      - name: Verifica il tag
        id: tag
        env:
          RAW: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]')"
          [[ "$tag" == v* ]] || tag="v$tag"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$RAW' non valido ('$tag'): la forma attesa e' vX.Y.Z"
            exit 1
          fi
          [[ "$tag" == "$RAW" ]] || echo "::warning::Tag '$RAW' normalizzato a '$tag'"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: app-release.apk
          fail_on_unmatched_files: false
          generate_release_notes: true

